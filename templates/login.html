{% extends 'base.html' %} {% block content %}
<div
  class="max-w-md mx-auto bg-white p-8 rounded-3xl border border-gray-100 shadow-sm mt-6"
>
  <h1 class="text-2xl font-bold text-gray-900 text-center mb-6">เข้าสู่ระบบ</h1>
  <form method="POST" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-semibold text-gray-600 mb-1"
        >ชื่อผู้ใช้ (Username)</label
      >
      <input
        type="text"
        name="username"
        required
        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none text-sm"
      />
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-600 mb-1"
        >รหัสผ่าน (Password)</label
      >
      <input
        type="password"
        name="password"
        required
        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none text-sm"
      />
    </div>
    <button
      type="submit"
      class="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium py-2.5 rounded-xl text-sm transition mt-2"
    >
      เข้าสู่ระบบ
    </button>
  </form>
  <p class="text-center text-xs text-gray-500 mt-6">
    ยังไม่มีบัญชีผู้ใช้?
    <a
      href="{% url 'register' %}"
      class="text-amber-600 font-semibold hover:underline"
      >สมัครสมาชิกที่นี่</a
    >
  </p>
</div>
{% endblock %}
