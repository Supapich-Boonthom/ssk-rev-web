{% extends "base.html" %}

{% block title %}
แก้ไขรีวิว - {{ place.name }}
{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-6 px-4">
  <!-- Back Button -->
  <a
    href="{% url 'place_detail' place.pk %}"
    class="inline-flex items-center gap-1.5 text-xs font-semibold text-gray-500 hover:text-amber-600 transition mb-4"
  >
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M15 19l-7-7 7-7"
      />
    </svg>
    กลับไปที่ {{ place.name }}
  </a>

  <!-- Edit Card -->
  <div class="bg-white rounded-3xl border border-gray-100 p-6 sm:p-8 shadow-sm">
    <div class="flex items-center gap-3 mb-6 pb-4 border-b border-gray-100">
      <div
        class="w-12 h-12 bg-amber-50 rounded-2xl flex items-center justify-center text-2xl text-amber-500 shrink-0"
      >
        ✏️
      </div>
      <div>
        <h1 class="text-xl font-bold text-gray-900">แก้ไขรีวิวของคุณ</h1>
        <p class="text-xs text-gray-500 mt-0.5">
          สถานที่:
          <span class="font-semibold text-gray-700">{{ place.name }}</span>
        </p>
      </div>
    </div>

    <form method="POST" enctype="multipart/form-data" class="space-y-5">
      {% csrf_token %}

      <!-- คะแนนความประทับใจ -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          ⭐ ให้คะแนนความประทับใจ <span class="text-rose-500">*</span>
        </label>
        <input
          type="hidden"
          name="rating"
          id="rating-input"
          value="{{ review.rating|default:'5' }}"
          required
        />
        <div
          class="flex items-center gap-1.5 cursor-pointer"
          id="star-rating-container"
        >
          {% for i in "12345" %}
          <button
            type="button"
            data-value="{{ forloop.counter }}"
            class="star-btn p-1 text-3xl text-amber-400 hover:scale-125 transition-transform duration-150 focus:outline-none"
          >
            ★
          </button>
          {% endfor %}
          <span id="rating-text" class="ml-2 text-sm font-bold text-amber-600">
            {{ review.rating }} ดาว
          </span>
        </div>
      </div>

      <!-- ความคิดเห็น -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">
          💬 ความคิดเห็น <span class="text-rose-500">*</span>
        </label>
        <textarea
          name="comment"
          rows="4"
          required
          placeholder="แชร์ความประทับใจ หรือข้อแนะนำสั้นๆ..."
          class="w-full p-3.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-amber-400 focus:outline-none text-sm"
        >
{{ review.comment }}</textarea
        >
      </div>

      <!-- แนบรูปภาพเพิ่มเติม -->
      <div class="pt-1">
        <label
          class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5"
        >
          📷 แนบรูปภาพเพิ่มเติม (เลือกได้หลายรูป)
        </label>
        <input
          type="file"
          id="review-image-input"
          name="upload_images"
          multiple
          accept="image/*"
          class="block w-full text-xs text-gray-500 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100 cursor-pointer border border-dashed border-gray-200 rounded-2xl p-2 bg-gray-50/50"
        />
        <div
          id="image-preview-container"
          class="flex flex-wrap gap-2.5 mt-3 hidden"
        ></div>
      </div>

      <!-- ปุ่มบันทึก & ยกเลิก -->
      <div class="pt-4 flex items-center gap-3">
        <button
          type="submit"
          class="flex-1 py-3 px-5 bg-amber-500 hover:bg-amber-600 active:scale-[0.98] text-white font-semibold rounded-2xl text-sm transition shadow-sm hover:shadow"
        >
          บันทึกการแก้ไข
        </button>
        <a
          href="{% url 'place_detail' place.pk %}"
          class="py-3 px-5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-2xl text-sm transition"
        >
          ยกเลิก
        </a>
      </div>
    </form>
  </div>
</div>

<script>
  const starBtns = document.querySelectorAll(".star-btn");
  const ratingInput = document.getElementById("rating-input");
  const ratingText = document.getElementById("rating-text");

  const ratingLabels = {
    1: "1 ดาว (ต้องปรับปรุง)",
    2: "2 ดาว (พอใช้)",
    3: "3 ดาว (ค่อนข้างดี)",
    4: "4 ดาว (ดีมาก)",
    5: "5 ดาว (ยอดเยี่ยม)",
  };

  function updateStars(rating) {
    ratingInput.value = rating;
    ratingText.textContent = ratingLabels[rating] || rating + " ดาว";

    starBtns.forEach((btn) => {
      const btnVal = parseInt(btn.getAttribute("data-value"));
      if (btnVal <= rating) {
        btn.classList.remove("text-gray-300");
        btn.classList.add("text-amber-400");
      } else {
        btn.classList.remove("text-amber-400");
        btn.classList.add("text-gray-300");
      }
    });
  }

  starBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      const val = parseInt(btn.getAttribute("data-value"));
      updateStars(val);
    });
  });

  updateStars(parseInt(ratingInput.value) || 5);

  // Preview images
  const imageInput = document.getElementById("review-image-input");
  const previewContainer = document.getElementById("image-preview-container");

  if (imageInput && previewContainer) {
    imageInput.addEventListener("change", function () {
      previewContainer.innerHTML = "";
      const files = Array.from(this.files);
      if (files.length > 0) {
        previewContainer.classList.remove("hidden");
        files.forEach((file, index) => {
          if (!file.type.startsWith("image/")) return;
          const reader = new FileReader();
          reader.onload = function (e) {
            const div = document.createElement("div");
            div.className =
              "relative w-20 h-20 rounded-xl overflow-hidden border border-gray-200 shadow-sm bg-gray-50";
            div.innerHTML = `
              <img src="${e.target.result}" class="w-full h-full object-cover">
              <span class="absolute bottom-1 right-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded-md font-medium">
                ${index + 1}
              </span>
            `;
            previewContainer.appendChild(div);
          };
          reader.readAsDataURL(file);
        });
      } else {
        previewContainer.classList.add("hidden");
      }
    });
  }
</script>
{% endblock %}
